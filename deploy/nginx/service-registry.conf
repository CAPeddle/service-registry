# Serves the service registry for every address that reaches port 80:
# the LAN IP, the z2 hostname, the Tailscale IP and the MagicDNS name.
# Install as /etc/nginx/sites-available/service-registry and remove the
# sites-enabled/default symlink, which otherwise claims default_server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
